name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Semver Tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag '${TAG_VERSION}' is not valid semver (must be MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "Semver tag validated: ${TAG_VERSION}"

      - name: Verify Version Consistency
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          # 版本单一来源：internal/version/version.go（release 由 ldflags 注入 tag）
          GO_VERSION="$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go | head -1)"
          if [[ -z "$GO_VERSION" ]]; then
            echo "ERROR: 无法从 internal/version/version.go 解析版本"
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$GO_VERSION" ]]; then
            echo "ERROR: Tag (${TAG_VERSION}) != internal/version default (${GO_VERSION})"
            exit 1
          fi
          echo "Version check passed: ${TAG_VERSION}"

      - name: Install ShellCheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck bin/easywork lib/*.sh

      - name: Syntax Check
        run: |
          for f in bin/easywork lib/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Install BATS
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Run Tests
        run: tests/run.sh

      - name: Dry-run Verification
        run: |
          ./bin/easywork install --dry-run --yes
          ./bin/easywork uninstall --dry-run --yes --remove-config

      - name: Generate Release Body
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          cat > /tmp/release-body.md << BODYEOF
          # EasyWork —— 一条命令，配置好你的开发环境

          适用于 macOS / Linux / Windows 的开发环境一键配置工具。Shell/PowerShell 环境、Git 身份与别名、Vim、gh、AI 工具即装即用。

          ---

          ## 🚀 快速开始

          \`\`\`bash
          # macOS / Linux（含 Windows Git Bash）
          curl -sL https://raw.githubusercontent.com/EasyIndie/EasyWork/${TAG_VERSION}/bootstrap.sh | bash
          \`\`\`

          \`\`\`powershell
          # Windows（PowerShell 原生）
          irm https://raw.githubusercontent.com/EasyIndie/EasyWork/${TAG_VERSION}/bootstrap.ps1 | iex
          \`\`\`

          \`\`\`bash
          # 配置开发环境
          ew install --yes
          \`\`\`

          > 系统要求：macOS / Linux / Windows，已联网（Unix 需 curl；Windows 用系统自带 PowerShell）。

          ---

          ## 📖 使用指南

          | 命令 | 说明 |
          |---|---|
          | \`easywork install\` | 一键安装全部组件 |
          | \`easywork install <模块[/子组件]>\` | 只安装指定组件（如 \`git\`、\`ai/claude\`、\`glow\`） |
          | \`easywork uninstall\` | 卸载全部组件 |
          | \`easywork uninstall <模块>\` | 卸载指定组件 |
          | \`easywork config\` | 查看配置文件 |
          | \`easywork config edit\` | 编辑配置文件 |
          | \`easywork version\` | 查看版本和已安装组件 |
          | \`easywork update\` | 检查并升级到最新版本 |
          | \`easywork help\` | 显示帮助信息 |

          **全局选项：** \`--dry-run\` 预览 · \`--yes\` / \`-y\` 跳过确认 · \`--verbose\` / \`-v\` 详细输出 · \`--json\` 机器可读 · \`--offline\` 禁止联网

          **模块：** shell（Shell/PowerShell 环境）· git（身份 + 90+ 别名）· gh（GitHub CLI）· vim（IDE）· ai（claude/codex/pi，可细选）

          **可选 CLI 工具（默认不装）：** glow · herdr · mole

          ---

          ## 📋 变更记录

          BODYEOF

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            echo "### Changes since ${PREV_TAG}" >> /tmp/release-body.md
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' >> /tmp/release-body.md
          else
            echo "### 首次发布" >> /tmp/release-body.md
            git log --pretty=format:'- %s (%h)' >> /tmp/release-body.md
          fi
          echo "" >> /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Generate SHA256 Checksums
        run: |
          cd "${{ github.workspace }}"
          for f in bin/easywork lib/*.sh easywork.conf.example; do
            if [ -f "$f" ]; then
              echo "Generating checksum for $f"
              sha256sum "$f" > "${f}.sha256"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-body.md
          files: |
            bin/easywork
            bin/easywork.sha256
            lib/*.sh
            lib/*.sh.sha256
            easywork.conf.example
            easywork.conf.example.sha256
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build & archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          BIN=ew
          [ "$GOOS" = windows ] && BIN=ew.exe
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath \
            -ldflags "-s -w -X github.com/EasyIndie/EasyWork/internal/version.Version=${TAG}" \
            -o "dist/${BIN}" ./cmd/ew
          cd dist
          NAME="easywork_${TAG}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            zip "${NAME}.zip" "${BIN}"
          else
            tar czf "${NAME}.tar.gz" "${BIN}"
          fi
          ls -la

      - name: Upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/easywork_*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Checksums & attestation
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" --pattern 'easywork_*' --dir dist
          cd dist
          sha256sum easywork_* > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/easywork_*

      - name: Upload checksums
        uses: softprops/action-gh-release@v3
        with:
          files: dist/checksums.txt
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
