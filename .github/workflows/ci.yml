name: CI

# 迭代分层（详见 docs/ITERATION.md）：
# - pull_request      → 只跑 quick（~1 分钟）：PR 反馈快，重矩阵留给 main
# - push:main         → quick + 重矩阵（仅当有代码改动时；纯文档/站点提交自动跳过）
# - workflow_dispatch → 手动选 fast / full，用于「只跑一次快速迭代」
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'fast = 只跑快速门禁（约 1 分钟）；full = 全量平台矩阵'
        type: choice
        options: [fast, full]
        default: fast

permissions:
  contents: read

# 单次迭代只占一条流水线：同分支新提交立刻取消仍在跑的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # 基线不可用（首次推送、force push、手动触发）→ 按"有代码改动"处理
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2> /dev/null; then
            echo "基线不可用，按有代码改动处理"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          printf '改动的文件：\n%s\n' "$changed"
          # 纯 docs/site/markdown 提交不触发重矩阵
          if printf '%s\n' "$changed" | grep -Eqv '^(docs/|site/|.*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 快车道：每次迭代必过，目标 < 2 分钟 ─────────────────────
  quick:
    name: Quick gate (${{ github.event_name }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install shell tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck shfmt

      # Bash 引擎已于 0.4.0 退役；仅引导/辅助脚本保留 shell 检查。
      - name: ShellCheck（bootstrap + scripts）
        shell: bash
        run: shellcheck bootstrap.sh scripts/*.sh

      - name: Syntax Check（bash -n）
        shell: bash
        run: |
          for f in bootstrap.sh scripts/*.sh; do
            echo "Checking $f..."
            bash -n "$f" || exit 1
          done

      - name: Format Check（shfmt）
        shell: bash
        run: shfmt -d -i 4 -bn -ci -sr bootstrap.sh scripts

      - name: gofmt + go vet
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            echo "需要 gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Go unit tests
        shell: bash
        run: go test ./...

      - name: Install BATS
        shell: bash
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          sudo "$RUNNER_TEMP/bats/install.sh" /usr/local

      - name: Conformance (Go)
        shell: bash
        run: tests/conformance/run.sh go

  # ── 重矩阵：仅 main 推送 / 手动 full，且确有代码改动 ────────
  shell-lint:
    name: Shell lint (macos-latest)
    runs-on: macos-latest
    needs: [changes, quick]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && inputs.scope != 'fast'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shell tools
        shell: bash
        run: brew install shellcheck shfmt

      - name: ShellCheck + shfmt（macOS 自带 bash 3.2 语义）
        shell: bash
        run: |
          set -euo pipefail
          shellcheck bootstrap.sh scripts/*.sh
          shfmt -d -i 4 -bn -ci -sr bootstrap.sh scripts

  install-e2e:
    name: Install chain e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, quick]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && inputs.scope != 'fast'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # 安装入口必须有自动化门禁；所有链路只访问 127.0.0.1 的本地镜像，不触网。
      - name: bootstrap.sh 端到端（Unix：本地镜像 + sha256 + 篡改拦截）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/bootstrap-e2e.sh

      # 注意：这些步骤的内联脚本必须保持纯 ASCII（Windows PowerShell 5.1 按 ANSI 解析无 BOM 脚本）
      - name: bootstrap.ps1 e2e - Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-e2e.ps1 -ChildShell powershell

      - name: bootstrap.ps1 e2e - PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/bootstrap-e2e.ps1 -ChildShell pwsh

      - name: update 自升级端到端（Unix：本地镜像）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/update-e2e.sh

  go-engine:
    name: Go engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, quick]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && inputs.scope != 'fast'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # ubuntu 已由 quick 覆盖（单测 + conformance），这里只补平台差异
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Go unit tests
        shell: bash
        run: go test ./...

      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            echo "需要 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        shell: bash
        run: go vet ./...

      - name: Install BATS (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v brew > /dev/null 2>&1; then
            brew install bats-core
          else
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
            sudo /tmp/bats/install.sh /usr/local
          fi

      - name: Conformance (Go, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tests/conformance/run.sh go

      - name: Conformance (Go-only, Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          export BATS="$(cygpath -u "$RUNNER_TEMP")/bats-core/bin/bats"
          tests/conformance/run.sh go

      - name: Native Windows smoke (Go engine)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/ew.exe" ./cmd/ew
          mkdir -p "$RUNNER_TEMP/home"
          export HOME="$RUNNER_TEMP/home"
          export EASYWORK_HOME="$RUNNER_TEMP/home/.easywork"
          "$RUNNER_TEMP/ew.exe" status --json --offline | grep -q '"ok":true'
          "$RUNNER_TEMP/ew.exe" list --json --offline | grep -q '"name":"ai"'
          "$RUNNER_TEMP/ew.exe" list --json --offline | grep -q '"optional":true'
          "$RUNNER_TEMP/ew.exe" config set git.identities.personal.name 'Win User'
          "$RUNNER_TEMP/ew.exe" config get git.identities.personal.name | grep -q 'Win User'
          "$RUNNER_TEMP/ew.exe" install shell git --yes --offline
          grep -q 'managed section' "$RUNNER_TEMP/home/.sh_config_custom" 2> /dev/null || grep -rq 'managed section' "$RUNNER_TEMP/home/Documents" 2> /dev/null

  cross-compile:
    name: Cross-compile (6 targets)
    runs-on: ubuntu-latest
    needs: [changes, quick]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && inputs.scope != 'fast'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build darwin/linux/windows x amd64/arm64
        shell: bash
        run: |
          set -euo pipefail
          for goos in darwin linux windows; do
            for goarch in amd64 arm64; do
              echo "==> $goos/$goarch"
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -o /dev/null ./cmd/ew
            done
          done
          echo "✅ 6 targets built"
