name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Tools
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/bin/shellcheck
            /usr/local/bin/shfmt
            /usr/local/bin/bats
            /usr/local/libexec/bats-core
            ~/go/bin/shfmt
          key: ${{ runner.os }}-easywork-tools-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install ShellCheck
        shell: bash
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install shellcheck
          else
            sudo apt-get update -y && sudo apt-get install -y shellcheck
          fi

      - name: Install shfmt
        shell: bash
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install shfmt
          else
            sudo apt-get install -y shfmt || go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          fi

      - name: Install zsh
        shell: bash
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y zsh
          fi

      - name: Install BATS
        shell: bash
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install bats-core
          else
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
            sudo /tmp/bats/install.sh /usr/local
          fi

      - name: ShellCheck
        shell: bash
        run: shellcheck bin/easywork lib/*.sh tests/helpers/mocks.bash

      - name: Syntax Check (bash)
        shell: bash
        run: |
          for f in bin/easywork lib/*.sh; do
            echo "Checking $f..."
            bash -n "$f" || exit 1
          done

      - name: Syntax Check (zsh)
        shell: bash
        run: |
          for f in bin/easywork lib/*.sh; do
            echo "Checking $f..."
            zsh -n "$f" 2>/dev/null || echo "  (zsh syntax check skipped — not a zsh script)"
          done

      - name: Run Tests
        shell: bash
        run: tests/run.sh

      - name: Dry-run Install
        shell: bash
        run: ./bin/easywork install --dry-run --yes

      - name: Dry-run Uninstall
        shell: bash
        run: ./bin/easywork uninstall --dry-run --yes --remove-config

      - name: Format Check
        shell: bash
        run: shfmt -d -i 4 -bn -ci -sr .
